scan:
  name: 扫描 HA 设备
  description: 扫描 HA 中可同步的设备与功能（排除 HDL LINK 自有设备），返回设备、功能与建议的 HDL 功能类型。
  fields:
    entry_id:
      name: 配置条目
      description: 多网关时指定某个 HDL LINK 配置条目，仅用于标记返回结果。
      example: 01JABCDEF
      selector:
        text:

provision:
  name: 同步设备到 HDL 网关
  description: 把勾选的 HA 设备写成 HDL 物理模型（oid 由 device_id 派生），并把勾选的功能写成功能点（sid = oid + 序号段），写入后立即上报一次状态让功能点上线。
  fields:
    devices:
      name: 设备与功能
      description: 设备数组，每项包含 device_id、name、model、domain 与 functions（entity_id、name、spk）。
      required: true
      example: '[{"device_id":"abc","name":"客厅灯","model":"米家吸顶灯","domain":"light","functions":[{"entity_id":"light.keting","name":"客厅灯","spk":"light.dimming"}]}]'
      selector:
        object:
    dry_run:
      name: 演练模式
      description: 开启时只返回写入计划，不真正写网关。
      default: true
      selector:
        boolean:
    entry_id:
      name: 配置条目
      description: 多网关时指定目标网关。
      example: 01JABCDEF
      selector:
        text:

sync:
  name: 上报已同步设备状态
  description: 把已写入网关的 HA 实体当前状态再上报一次（property/up）。网关只认这条上报来维持功能点在线，建议在自动化里定时调用。
  fields:
    entry_id:
      name: 配置条目
      description: 多网关时指定目标网关。
      example: 01JABCDEF
      selector:
        text:

bind:
  name: 绑定 HDL 按键/场景到 HA 实体
  description: 把 HDL 功能点、面板按键、场景或逻辑的 SID 绑定到一个 HA 实体。mode=action 时每收到一次事件执行一次动作（面板键当遥控器）；mode=follow 时跟随属性状态。
  fields:
    sid:
      name: HDL SID
      description: 功能点/场景/逻辑的 SID，可从日志里的「HDL 场景/逻辑事件未绑定」看到。
      required: true
      example: "0201036AFD43B20A0A0100011100"
      selector:
        text:
    entity_id:
      name: HA 实体
      description: 目标实体；传空值表示删除该 SID 的绑定。
      example: "light.keting"
      selector:
        entity:
    mode:
      name: 绑定模式
      description: action = 每次事件执行一次动作；follow = 跟随属性状态（用于真实设备的功能点）。
      default: action
      selector:
        select:
          options:
            - "action"
            - "follow"
    action:
      name: 动作
      description: mode=action 时执行的服务，如 toggle / turn_on / turn_off / open / close / run。
      default: toggle
      selector:
        text:
    trigger:
      name: 触发条件（follow 模式用）
      description: any / on / off。
      default: any
      selector:
        select:
          options:
            - "any"
            - "on"
            - "off"
scene_list:
  name: 列出网关场景及绑定状态
  description: 读取 HDL 网关里的全部场景，并给出每个场景是否已绑定 HA 实体、绑到哪个实体、以及绑定了但网关侧已不存在的失效绑定。用于排查「面板按了没反应」。
  fields:
    entry_id:
      name: 配置条目
      description: 多网关时可指定；只有一个网关时留空。
      selector:
        text:
